name: Build Strides Windows EXE and VST3

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up CMake
        uses: lukka/get-cmake@latest

      - name: Check project and configure
        run: |
          $project = 'Strides_project/Strides'
          if (-not (Test-Path "$project/CMakeLists.txt")) {
            throw "CMakeLists.txt not found at $project. Check the repository folder layout."
          }
          cmake -S $project -B build -G 'Visual Studio 17 2022' -A x64 -DCMAKE_BUILD_TYPE=Release

      - name: Build Release
        run: cmake --build build --config Release --parallel

      - name: Locate generated artifacts
        run: |
          Get-ChildItem build -Recurse -File |
            Where-Object { $_.Extension -in @('.exe', '.vst3') } |
            Select-Object -ExpandProperty FullName
          Get-ChildItem build -Recurse -Directory -Filter '*.vst3' |
            Select-Object -ExpandProperty FullName

      - name: Stage standalone EXE and VST3
        run: |
          New-Item -ItemType Directory -Force artifacts/Standalone, artifacts/VST3 | Out-Null
          $exe = Get-ChildItem build -Recurse -File -Filter '*.exe' |
            Where-Object { $_.FullName -match 'Standalone' } |
            Select-Object -First 1
          if ($exe) { Copy-Item $exe.FullName artifacts/Standalone/ }
          $vst3 = Get-ChildItem build -Recurse -Directory -Filter '*.vst3' | Select-Object -First 1
          if ($vst3) { Copy-Item $vst3.FullName artifacts/VST3/ -Recurse }
          $vst3File = Get-ChildItem build -Recurse -File -Filter '*.vst3' | Select-Object -First 1
          if ($vst3File) { Copy-Item $vst3File.FullName artifacts/VST3/ }
          if (-not $exe -and -not $vst3 -and -not $vst3File) {
            throw 'No standalone EXE or VST3 was found. Check JUCE FORMATS and build output.'
          }

      - name: Upload Windows builds
        uses: actions/upload-artifact@v4
        with:
          name: Strides-Windows-EXE-VST3
          path: artifacts/
          if-no-files-found: error
