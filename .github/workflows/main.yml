name: Build Strides Windows EXE and VST3

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-windows:
    runs-on: windows-2022
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure with Visual Studio 2022
        shell: pwsh
        run: |
          cmake -S Strides_project/Strides -B build -G "Visual Studio 17 2022" -A x64

      - name: Build Release
        shell: pwsh
        run: cmake --build build --config Release --parallel 2

      - name: Collect EXE and VST3 artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          $files = Get-ChildItem -Path build -Recurse -File | Where-Object {
            ($_.Extension -eq '.exe' -and $_.FullName -match 'Release|Standalone') -or $_.Extension -eq '.vst3'
          }
          $bundles = Get-ChildItem -Path build -Recurse -Directory -Filter '*.vst3'
          foreach ($file in $files) {
            $destination = Join-Path artifacts $file.Name
            Copy-Item -LiteralPath $file.FullName -Destination $destination -Force
          }
          foreach ($bundle in $bundles) {
            Copy-Item -LiteralPath $bundle.FullName -Destination (Join-Path artifacts $bundle.Name) -Recurse -Force
          }
          Get-ChildItem artifacts -Recurse | Select-Object FullName
          if (-not (Get-ChildItem artifacts -Recurse -File | Where-Object { $_.Extension -in '.exe', '.vst3' })) {
            throw 'No EXE or VST3 output found. Check JUCE targets and CMake build logs.'
          }

      - name: Upload Windows builds
        uses: actions/upload-artifact@v4
        with:
          name: Strides-Windows-EXE-VST3
          path: artifacts/
          if-no-files-found: error
