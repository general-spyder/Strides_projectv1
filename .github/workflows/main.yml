name: Build Strides Windows EXE and VST3

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-windows:
    runs-on: windows-2022
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure with Visual Studio 2022
        shell: pwsh
        run: |
          cmake -S Strides_project/Strides -B build -G "Visual Studio 17 2022" -A x64

      - name: Build Release
        shell: pwsh
        run: cmake --build build --config Release --parallel 2

      - name: Collect EXE and VST3 artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $env:GITHUB_WORKSPACE 'artifacts'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $buildRoot = Join-Path $env:GITHUB_WORKSPACE 'build'

          $exes = @(Get-ChildItem -LiteralPath $buildRoot -Recurse -File -Filter '*.exe' |
            Where-Object { $_.FullName -match 'Release|Standalone' -and $_.FullName -notmatch 'CMakeFiles|CompilerId' })
          foreach ($exe in $exes) {
            $dest = Join-Path $out 'Standalone'
            New-Item -ItemType Directory -Force -Path $dest | Out-Null
            Copy-Item -LiteralPath $exe.FullName -Destination (Join-Path $dest $exe.Name) -Force
            Write-Host "Collected EXE: $($exe.FullName)"
          }

          $bundles = @(Get-ChildItem -LiteralPath $buildRoot -Recurse -Directory -Filter '*.vst3' |
            Where-Object { $_.FullName -match 'Release|VST3' })
          foreach ($bundle in $bundles) {
            $dest = Join-Path $out 'VST3'
            New-Item -ItemType Directory -Force -Path $dest | Out-Null
            $target = Join-Path $dest $bundle.Name
            if (Test-Path -LiteralPath $target) { Remove-Item -LiteralPath $target -Recurse -Force }
            Copy-Item -LiteralPath $bundle.FullName -Destination $target -Recurse -Force
            Write-Host "Collected VST3 bundle: $($bundle.FullName)"
          }

          $standalone = @(Get-ChildItem -LiteralPath (Join-Path $out 'Standalone') -File -ErrorAction SilentlyContinue)
          $plugins = @(Get-ChildItem -LiteralPath (Join-Path $out 'VST3') -Directory -Filter '*.vst3' -ErrorAction SilentlyContinue)
          if ($standalone.Count -eq 0 -or $plugins.Count -eq 0) {
            Write-Host 'Build files found:'
            Get-ChildItem -LiteralPath $buildRoot -Recurse | Where-Object { $_.Name -match '\.exe$|\.vst3$' } | Select-Object -ExpandProperty FullName
            throw "Expected standalone EXE and VST3 bundle; found $($standalone.Count) EXE(s), $($plugins.Count) VST3 bundle(s)."
          }

      - name: Upload Windows builds
        uses: actions/upload-artifact@v4
        with:
          name: Strides-Windows-EXE-VST3
          path: artifacts/
          if-no-files-found: error
